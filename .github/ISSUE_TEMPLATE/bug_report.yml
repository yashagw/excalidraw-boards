name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a board with …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or image tag you run (`git rev-parse --short HEAD`).
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Editor / Boards sidebar
        - MCP tools
        - Docker / self-hosting
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server logs (`docker compose logs`), browser console errors, or a screenshot.
